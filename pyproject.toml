[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-predictor"
version = "0.1.0"
description = "Premier League match predictions with fan sentiment from X (Twitter), Hugging Face and Plotly Dash"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tweepy>=4.14",
    "dash>=2.17",
    "dash-ag-grid>=31.0",
    "plotly>=5.22",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "certifi>=2026.10.19",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Scoring real tweets (run, score, watch). The demo, dashboard and predictor work without it.
sentiment = ["transformers>=4.44", "torch>=2.3"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
pl-predictor = "pl_predictor.cli:main"

[tool.setuptools]
packages = ["pl_predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
