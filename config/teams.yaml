# Premier League clubs and the terms used to find and attribute tweets.
#
# - code:      three-letter code; matchday hashtags are built as #<HOME><AWAY> (e.g. #ARSMCI)
# - hashtags:  club hashtags (without the #)
# - handles:   official X accounts (without the @)
# - keywords:  plain-text names/nicknames; matched on word boundaries, case-insensitive
#
# Club list reflects the 2026/27 season. Update it after promotion/relegation.
# Avoid ambiguous keywords ("Blues", "Reds", "City", "United", "Forest", "Palace",
# "Villa") - they pull unrelated tweets into the query and the attribution.

teams:
  - name: Arsenal
    code: ARS
    hashtags: [Arsenal, AFC, COYG]
    handles: [Arsenal]
    keywords: [Arsenal, Gunners]

  - name: Aston Villa
